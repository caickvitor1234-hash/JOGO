services:
  - type: web
    name: sala-de-jogos
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: sala-de-jogos-data
      mountPath: /var/data
      sizeGB: 1
